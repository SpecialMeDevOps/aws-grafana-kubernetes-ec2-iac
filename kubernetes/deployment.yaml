apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-grafana-demo
  namespace: aws-grafana
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aws-grafana-demo
  template:
    metadata:
      labels:
        app: aws-grafana-demo
    spec:
      containers:
        - name: app
          image: aws-grafana-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
