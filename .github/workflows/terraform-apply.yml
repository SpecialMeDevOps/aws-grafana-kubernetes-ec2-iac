name: Terraform Apply

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform apply
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: true
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT_NAME: aws-grafana-kubernetes-ec2-iac
      ENVIRONMENT: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require deployment branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "This deployment workflow must run from the main branch."
            echo "Current ref: $GITHUB_REF"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity
          aws configure list

      - name: Check for existing EC2 instance before apply
        run: |
          chmod +x scripts/check-existing-ec2.sh
          PROJECT_NAME="$PROJECT_NAME" ENVIRONMENT="$ENVIRONMENT" AWS_REGION="$AWS_REGION" ./scripts/check-existing-ec2.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform fmt check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=terraform init

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform plan
        run: terraform -chdir=terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform -chdir=terraform apply -auto-approve tfplan

      - name: Show Terraform outputs
        run: terraform -chdir=terraform output
